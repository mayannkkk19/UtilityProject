<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { 
      width: 220px; 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 12px;
      margin: 0;
    }
    h3 {
      margin-top: 5px;
      font-size: 16px;
      color: #333;
    }
    #qrcode { 
      display: flex;
      justify-content: center;
      margin: 12px auto; 
    }
    #status { 
      font-size: 12px; 
      color: #555; 
      font-weight: bold;
      margin-bottom: 5px;
    }
  </style>

  <!-- Local Extension Dependencies -->
  <script src="qrcode.min.js"></script>
  <script src="socket.io.js"></script>
</head>
<body>
    <h3>Scan to Capture</h3>
    <img id="qrcode" src="" alt="QR Code" width="160" height="160">
    <p id="status">Generating QR code...</p>

    <!-- Script that initializes socket connection & QR rendering -->
    <script src="popup.js"></script>
</body>
</html>
